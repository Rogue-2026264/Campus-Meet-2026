        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Feedback</title>
            <link rel="stylesheet" href="style.css">
        </head>

        <body>

        <header>
            <h3>AVV Campus Sports Meet</h3>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="sports.html">Sports</a></li>
                    <li><a href="feedback.html">Feedback</a></li>
                </ul>
            </nav>
        </header>

        <div class="container">

        <form id="feedbackForm">

            <h2>Feedback Form</h2>

            <input type="text" id="namef" placeholder="Enter your name"><br><br>

            <input type="text" id="registration"
                placeholder="Enter registration number"><br><br>

            <select id="Event">
                <option value="">Select Sport</option>
                <option>Cricket</option>
                <option>Kabaddi</option>
                <option>Football</option>
                <option>Badminton</option>
                <option>Basketball</option>
            </select><br><br>

            <input type="number" id="rate"
                min="1" max="5"
                placeholder="Rate the event"><br><br>

            <textarea id="review"
                    placeholder="Leave your review"></textarea><br><br>

            <button type="button" onclick="submitFeedback()">
                Submit Feedback
            </button>

        </form>

        </div>

        <br>

        <div id="revdisp"></div>

        <script src="script.js"></script>

        </body>
        </html>
